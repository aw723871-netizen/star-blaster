<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Star Blaster</title>
<style>
:root{--bg:#000;--ink:#fff;--blue:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#050a18;max-width:100%;max-height:100%;aspect-ratio:9/16;height:100%;border-left:1px solid #14213d;border-right:1px solid #14213d}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem}
#ui.hide{display:none}
.card{background:rgba(0,0,0,.82);border:1.5px solid var(--blue);border-radius:1rem;padding:1.6rem 1.8rem;max-width:300px}
h1{margin:0 0 .4rem;font-size:2.2rem;letter-spacing:-.02em}
p{margin:.3rem 0 1rem;color:#b9c3d6;line-height:1.5}
button{background:var(--blue);color:#fff;border:0;border-radius:.6rem;padding:.8rem 1.8rem;font:600 1.05rem system-ui;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="360" height="640" aria-label="Star Blaster game"></canvas></div>
<div id="ui"><div class="card">
<h1 id="t">Star Blaster</h1>
<p id="m">Drag your finger (or use ← → keys) to move. Your ship fires automatically. Destroy the blocks before they reach the bottom.</p>
<button id="go">Play</button>
</div></div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=640;
var ui=document.getElementById('ui'),T=document.getElementById('t'),M=document.getElementById('m'),G=document.getElementById('go');
var best=0;try{best=+localStorage.getItem('sb_best')||0}catch(e){}
var state='menu',ship,bullets,foes,parts,stars,score,lives,t0,lastShot,spawnT,keys={},tx=null,last=0,shake=0;
var ac=null;
function beep(f,d,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=v||.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
stars=[];for(var i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.5});
function reset(){ship={x:W/2,y:H-70,w:34,h:34};bullets=[];foes=[];parts=[];score=0;lives=3;lastShot=0;spawnT=0;t0=0}
function start(){reset();state='play';ui.className='hide';beep(520,.12)}
function over(){state='over';if(score>best){best=score;try{localStorage.setItem('sb_best',best)}catch(e){}}
T.textContent='Game over';M.innerHTML='Score: <b>'+score+'</b><br>Best: <b>'+best+'</b>';G.textContent='Play again';ui.className='';G.focus()}
G.onclick=start;
addEventListener('keydown',function(e){keys[e.key]=1;if(e.key==='Enter'&&state!=='play')start()});
addEventListener('keyup',function(e){keys[e.key]=0});
function px(e){var r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
c.addEventListener('pointerdown',function(e){tx=px(e)});
c.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')tx=px(e)});
addEventListener('pointerup',function(){tx=null});
function burst(a,b,col){for(var i=0;i<12;i++)parts.push({x:a,y:b,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,l:.5,c:col})}
function spawn(){var lv=Math.floor(score/150),hp=Math.random()<Math.min(.5,.08*lv)?2:1,s=hp==2?40:30;
foes.push({x:s/2+Math.random()*(W-s),y:-s,s:s,hp:hp,vy:60+Math.random()*40+lv*8,w:Math.random()*2})}
function hit(a,b){return Math.abs(a.x-b.x)<(a.w||a.s)/2+(b.w||b.s)/2-2&&Math.abs(a.y-b.y)<(a.h||a.s)/2+(b.h||b.s)/2-2}
function update(dt){
t0+=dt;
var sp=300;
if(keys.ArrowLeft||keys.a)ship.x-=sp*dt;
if(keys.ArrowRight||keys.d)ship.x+=sp*dt;
if(tx!==null)ship.x+=(tx-ship.x)*Math.min(1,dt*14);
ship.x=Math.max(20,Math.min(W-20,ship.x));
lastShot+=dt;if(lastShot>.22){lastShot=0;bullets.push({x:ship.x,y:ship.y-20,w:4,h:12});beep(880,.05,.015)}
spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.3,.9-score/600)}
bullets.forEach(function(b){b.y-=520*dt});
bullets=bullets.filter(function(b){return b.y>-20});
foes.forEach(function(f){f.y+=f.vy*dt;f.w+=dt});
for(var i=foes.length-1;i>=0;i--){var f=foes[i];
 for(var j=bullets.length-1;j>=0;j--){if(hit(f,bullets[j])){bullets.splice(j,1);f.hp--;burst(f.x,f.y,'#fff');
  if(f.hp<=0){score+=f.s>30?30:10;burst(f.x,f.y,'#3b82f6');beep(200,.1,.05);foes.splice(i,1);break}}}
 if(foes[i]!==f)continue;
 if(hit(f,ship)){foes.splice(i,1);lives--;shake=.3;burst(ship.x,ship.y,'#fff');beep(90,.3,.08);if(lives<=0)over();continue}
 if(f.y>H+20){foes.splice(i,1);lives--;shake=.3;beep(90,.3,.08);if(lives<=0)over()}
}
}
function draw(dt){
x.save();if(shake>0){shake-=dt;x.translate((Math.random()-.5)*8,(Math.random()-.5)*8)}
x.fillStyle='#050a18';x.fillRect(-10,-10,W+20,H+20);
stars.forEach(function(s){s.y+=s.s*20*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}x.fillStyle='rgba(255,255,255,'+(.3+s.s*.25)+')';x.fillRect(s.x,s.y,s.s,s.s)});
if(state==='play'||state==='over'){
 foes.forEach(function(f){x.fillStyle=f.hp>1?'#1d4ed8':'#3b82f6';x.fillRect(f.x-f.s/2,f.y-f.s/2,f.s,f.s);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(f.x-f.s/2+3,f.y-f.s/2+3,f.s-6,f.s-6)});
 x.fillStyle='#fff';bullets.forEach(function(b){x.fillRect(b.x-2,b.y-6,b.w,b.h)});
 if(state==='play'){x.fillStyle='#fff';x.beginPath();x.moveTo(ship.x,ship.y-18);x.lineTo(ship.x+17,ship.y+16);x.lineTo(ship.x,ship.y+8);x.lineTo(ship.x-17,ship.y+16);x.closePath();x.fill();
 x.fillStyle='#3b82f6';x.fillRect(ship.x-3,ship.y-2,6,10)}
 parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;x.globalAlpha=Math.max(0,p.l*2);x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1;
 parts=parts.filter(function(p){return p.l>0});
 x.fillStyle='#fff';x.font='600 18px system-ui';x.textAlign='left';x.fillText('Score '+score,14,28);
 x.textAlign='right';x.fillText('Lives '+(lives>0?lives:0),W-14,28);
}
x.restore();
}
function loop(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(state==='play')update(dt);draw(dt);requestAnimationFrame(loop)}
reset();state='menu';requestAnimationFrame(loop);
})();
</script>
</body>
</html>
